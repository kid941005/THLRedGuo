name: Docker Checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validator
        run: python -m pip install pyyaml
      - name: Install media test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm run check
      - run: npm test
      - run: npm run test:vendor
      - name: Validate Compose
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build image
        run: docker build -f server/Dockerfile -t thlredguo-gateway:ci .
      - name: Check packaged runtime
        run: |
          docker run --rm --entrypoint sh thlredguo-gateway:ci -c '
            set -e
            test -f /app/server/gateway.js
            test -f /app/server/web/index.html
            test -f /app/server/vendor/hongguo-web/server/src/main.js
            test ! -d /app/assets
            test ! -f /app/server/vendor/hongguo-web/server/config/apikeys.json
            test ! -d /app/server/vendor/hongguo-web/server/stream-cache
            test ! -f /app/server/vendor/hongguo-web/data/playback-device.json
            ffmpeg -version >/dev/null
          '
      - name: Start container
        run: docker run -d --init --name gw-ci -p 127.0.0.1:8080:8080 thlredguo-gateway:ci
      - name: Check web and internal API
        run: node tools/container_smoke.cjs http://127.0.0.1:8080
      - name: Verify media pipeline inside Alpine image
        run: docker run --rm --init --entrypoint node -v "$PWD/tests:/app/tests:ro" thlredguo-gateway:ci --test /app/tests/runtime.test.cjs /app/tests/media.test.cjs /app/tests/api.test.cjs /app/tests/playback-response.test.cjs /app/tests/diagnostic-identity.test.cjs /app/tests/application.test.cjs /app/tests/supervisor.test.cjs /app/tests/web.test.cjs /app/tests/gateway.test.cjs /app/tests/ffmpeg.test.cjs
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs gw-ci || true
          docker rm -f gw-ci || true
