name: Static Checks

# 提交与 PR 的机械关卡：语法 / 配置 / 密钥 / Dart 静态分析。
# 与本地 pre-commit 钩子共用 tools/precommit_check.cjs，规则只有一份。
on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'shared/**'
      - 'assets/**'
      - 'tools/**'
      - 'server/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'docker-compose.yml'
      - 'docker-compose.build.yml'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'shared/**'
      - 'assets/**'
      - 'tools/**'
      - 'server/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'docker-compose.yml'
      - 'docker-compose.build.yml'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: 语法 / 配置 / 密钥
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pyyaml（YAML 校验用）
        run: python3 -m pip install --quiet pyyaml

      - name: 全仓静态检查
        run: node tools/precommit_check.cjs --all

      - name: compose 配置可解析
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q

      - name: 数据源契约（可加载 + 四个方法齐全）
        run: node tools/source_meta_check.cjs

  flutter-analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-pub
