name: Build Gateway Image (GHCR)

# 只构建短剧网关镜像，不参与 App 打包。
# 触发：推送 v* 标签，或手动运行（可指定镜像标签）。
on:
  push:
    # v*：随应用版本一起发布；gw-*：只发布网关、不触发 App 打包
    tags: ['v*', 'gw-*']
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（默认 latest）'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/thlredguo-gateway

jobs:
  build:
    name: build & push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # gw-v1.2.0 → v1.2.0，保证镜像标签与应用版本号一致
            type=match,pattern=^gw-(.*),group=1
            type=ref,event=tag
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=THLRedGuo Gateway
            org.opencontainers.image.description=短剧数据网关：红果取流代理 + 数据源下发
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 镜像已推送"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
