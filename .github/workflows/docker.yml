name: Publish Docker Image

on:
  push:
    tags: ['v*', 'gw-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Additional image tag'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/thlredguo-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg && python -m pip install pyyaml
      - name: Verify source before publishing
        run: |
          npm run check
          npm test
          npm run test:vendor
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Verify Alpine image before publishing
        run: |
          docker build -f server/Dockerfile -t thlredguo-gateway:verify .
          docker run --rm --init --entrypoint node -v "$PWD/tests:/app/tests:ro" thlredguo-gateway:verify --test /app/tests/runtime.test.cjs /app/tests/media.test.cjs /app/tests/api.test.cjs /app/tests/playback-response.test.cjs /app/tests/application.test.cjs /app/tests/supervisor.test.cjs /app/tests/web.test.cjs /app/tests/gateway.test.cjs /app/tests/ffmpeg.test.cjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=^gw-(.*),group=1
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=THLRedGuo Docker Web
            org.opencontainers.image.description=Browser interface and server-side playback
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
