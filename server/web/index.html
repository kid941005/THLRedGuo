<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红果网关 · 剧库</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --txt: #e6e8ee;
    --dim: #98a0b3;
    --accent: #ff5a5f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--txt);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 12px 16px;
    background: rgba(15, 17, 21, .92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6b7280; margin-left: 6px; vertical-align: middle; }
  .dot.ok { background: #22c55e; }
  .dot.bad { background: #ef4444; }
  form { display: flex; gap: 8px; flex: 1; min-width: 240px; max-width: 460px; }
  input[type="search"] {
    flex: 1; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--txt);
    outline: none; font-size: 14px;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  button {
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--txt);
    font-size: 14px;
  }
  button:hover { border-color: var(--accent); }
  nav { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 0; }
  nav button { white-space: nowrap; border-radius: 999px; padding: 6px 14px; }
  nav button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  main {
    display: grid; gap: 14px; padding: 16px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card .pic { aspect-ratio: 3 / 4; background: var(--panel-2); position: relative; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .rank {
    position: absolute; left: 8px; top: 8px;
    background: rgba(0,0,0,.65); padding: 1px 7px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
  }
  .card .meta { padding: 8px 10px 10px; }
  .card .title { font-size: 13px; line-height: 1.35; height: 2.7em; overflow: hidden; }
  .card .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .empty, .note {
    grid-column: 1 / -1; padding: 28px 16px; text-align: center; color: var(--dim);
    border: 1px dashed var(--line); border-radius: var(--radius);
  }
  .note b { color: var(--txt); }
  #more { padding: 0 16px 32px; text-align: center; }
  .sheet {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: rgba(0,0,0,.72); padding: 16px; overflow: auto;
  }
  .sheet.open { display: block; }
  .sheet-inner {
    max-width: 900px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  }
  .sheet-head { display: flex; gap: 14px; }
  .sheet-head img { width: 108px; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; background: var(--panel-2); }
  .sheet-head h2 { margin: 0 0 6px; font-size: 17px; }
  .sheet-head p { margin: 0; color: var(--dim); font-size: 13px; max-height: 5.2em; overflow: auto; }
  .close { margin-left: auto; align-self: flex-start; }
  video { width: 100%; margin-top: 14px; border-radius: 10px; background: #000; aspect-ratio: 9 / 16; max-height: 62vh; }
  .eps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; max-height: 26vh; overflow: auto; }
  .eps button { padding: 6px 12px; border-radius: 8px; font-size: 13px; }
  .eps button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #2b1d1f; border: 1px solid #7f1d1d; color: #fecaca;
    padding: 10px 16px; border-radius: 10px; max-width: 90vw; z-index: 60; display: none;
  }
  .toast.show { display: block; }
  [hidden] { display: none !important; }
  input:not([type="checkbox"]), select { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--txt); max-width: 100%; }
  input[type="checkbox"] { accent-color: var(--accent); }
  label { display: inline-flex; gap: 8px; align-items: center; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; align-items: center; }
  .toolbar button.active { border-color: var(--accent); color: var(--accent); }
  .stack { display: grid; gap: 12px; }
  .stack form { display: grid; min-width: 0; max-width: none; }
  .auth-screen { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 24px; }
  .auth-box { width: min(440px,100%); padding: 28px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
  .auth-box form { display: grid; max-width: none; min-width: 0; }
  .auth-box label { display: grid; gap: 6px; }
  .muted { color: var(--dim); font-size: 13px; }
  .error { color: #fda4af; white-space: pre-wrap; }
  .task { border: 1px solid var(--line); padding: 12px; border-radius: 10px; }
  .task .toolbar { padding: 8px 0 0; }
  .picks { display: flex; flex-wrap: wrap; gap: 10px; max-height: 180px; overflow: auto; margin-top: 10px; }
  .picks label { padding: 6px; background: var(--panel-2); border-radius: 6px; }
  progress { width: 100%; accent-color: var(--accent); }
  #panel-body { margin-top: 16px; }
  h2,h3 { line-height: 1.4; }
  .wide { width: 100%; }
  a { color: #fda4af; }
  button:disabled { opacity: .55; cursor: wait; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media(max-width:600px) { .sheet { padding: 6px; } .sheet-head img { width: 76px; } header { gap: 8px; } }

</style>
</head>
<body>
<header>
  <div class="brand">红果网关<span id="status" class="dot" title="网关状态"></span></div>
  <form id="search-form">
    <input id="q" type="search" placeholder="搜索剧名，如：霸总 / 归路" autocomplete="off">
    <button type="submit">搜索</button>
  </form>
  <button id="account-btn" type="button">账号</button>
  <span id="user-label" class="muted"></span>
</header>

<div class="toolbar" id="sections">
  <button id="nav-catalog" type="button">剧库</button><button id="nav-favorites" type="button">我的追剧</button>
  <button id="nav-history" type="button">观看历史</button><button id="nav-downloads" type="button">下载任务</button>
  <button id="nav-admin" type="button" hidden>管理后台</button>
</div>
<nav id="tabs"></nav>
<main id="grid"></main>
<div id="more" hidden><button id="more-btn">加载更多</button></div>

<div id="sheet" class="sheet">
  <div class="sheet-inner">
    <div class="sheet-head">
      <img id="d-cover" alt="">
      <div style="flex:1">
        <h2 id="d-title">—</h2>
        <p id="d-desc"></p>
        <p id="d-meta" style="margin-top:8px"></p>
      </div>
      <button class="close" id="d-close">关闭</button>
    </div>
    <div class="toolbar">
      <label>追剧状态 <select id="d-favorite"><option value="">未收藏</option><option value="want">想看</option><option value="watching">在看</option><option value="completed">已看完</option></select></label>
      <button id="d-resume" type="button" hidden>继续观看</button>
      <label><input id="autoplay" type="checkbox" checked>自动连播</label>
    </div>
    <video id="d-video" controls playsinline preload="none" hidden></video>
    <p id="d-status" role="status" aria-live="polite"></p>
    <div class="toolbar"><button id="player-prev" type="button" disabled>上一集</button><button id="player-retry" type="button" hidden>重试当前集</button><button id="player-next" type="button" disabled>下一集</button><span id="preload-status" class="muted"></span></div>
    <div class="eps" id="d-eps"></div>
    <details id="batch-box"><summary>批量下载到服务器</summary>
      <div class="toolbar"><button id="pick-all" type="button">全选</button><button id="pick-none" type="button">清空选择</button>
        <button id="download-selected" type="button">加入下载队列</button><span id="pick-count" class="muted"></span></div>
      <p class="muted">每次最多选择 200 集；准备完成后可在下载任务中保存单集，或合并为 ZIP。</p><div id="d-picks" class="picks"></div>
    </details>
  </div>
</div>

<div id="panel" class="sheet"><div class="sheet-inner"><div class="sheet-head"><h2 id="panel-title"></h2><button id="panel-close" class="close" type="button">关闭</button></div><div id="panel-body" class="stack"></div></div></div>
<div id="auth" class="auth-screen"><div class="auth-box stack">
  <h1 id="auth-title">登录红果剧库</h1><p id="auth-help" class="muted">使用管理员创建的账号登录。</p>
  <form id="auth-form"><label>用户名<input id="auth-username" autocomplete="username" minlength="3" maxlength="32" required></label>
    <label>密码<input id="auth-password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required></label>
    <label id="setup-label" hidden>初始化口令<input id="auth-token" autocomplete="off"></label>
    <button id="auth-submit" type="submit">登录</button></form><p id="auth-error" class="error" role="alert"></p>
</div></div>
<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';

  var TABS = [
    { id: 'board-recommend', name: '推荐榜', kind: 'rank', board: 'recommend' },
    { id: 'board-hot',       name: '热播榜', kind: 'rank', board: 'hot' },
    { id: 'board-new',       name: '新剧榜', kind: 'rank', board: 'new' },
    { id: 'genre-short_play',   name: '短剧',  kind: 'genre', genre: 'short_play' },
    { id: 'genre-comic_series', name: '漫剧',  kind: 'genre', genre: 'comic_series' },
    { id: 'genre-ai_series',    name: 'AI短剧', kind: 'genre', genre: 'ai_series' }
  ];
  var PAGE = 18;

  var el = {
    tabs: document.getElementById('tabs'),
    grid: document.getElementById('grid'),
    more: document.getElementById('more'),
    moreBtn: document.getElementById('more-btn'),
    status: document.getElementById('status'),
    form: document.getElementById('search-form'),
    q: document.getElementById('q'),
    sheet: document.getElementById('sheet'),
    cover: document.getElementById('d-cover'),
    title: document.getElementById('d-title'),
    desc: document.getElementById('d-desc'),
    meta: document.getElementById('d-meta'),
    video: document.getElementById('d-video'),
    playerStatus: document.getElementById('d-status'),
    eps: document.getElementById('d-eps'),
    close: document.getElementById('d-close'),
    toast: document.getElementById('toast'),
    favorite: document.getElementById('d-favorite'), resume: document.getElementById('d-resume'),
    autoplay: document.getElementById('autoplay'), picks: document.getElementById('d-picks'), pickCount: document.getElementById('pick-count')
  };

  var state = { tab: TABS[0], keyword: '', offset: 0, hasMore: false, loading: false, seen: [] };
  var listSequence = 0, detailSequence = 0, playSequence = 0;
  var listRequest, detailRequest, playRequest;
  var currentUser = null, csrf = '', setupRequired = false, view = 'catalog';
  var currentSeries = null, currentEpisodes = [], savedLibrary = null, playback = null, selectedEpisodes = new Set();
  var panelKind = '', taskSelections = new Set(), panelSequence = 0, librarySequence = 0;
  var progressWarningAt = 0;
  var selectedEpisode = null, retryTimer = null, preloadRequest = null, preloadedVid = '', preloadBusy = false;
  var playerRate = 1, playerVolume = 1, playerMuted = false;
  var byId = function (id) { return document.getElementById(id); };


  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.toast.classList.remove('show'); }, 4200);
  }

  function api(path, signal, options) {
    options = options || {};
    var requestIdentity = csrf;
    var request = new AbortController();
    function cancelled() { request.abort(); }
    if (signal) { signal.addEventListener('abort', cancelled, { once: true }); if (signal.aborted) request.abort(); }
    var timedOut = false;
    var timer = setTimeout(function () { timedOut = true; request.abort(); }, 15000);
    return fetch(path, { method: options.method || 'GET', headers: Object.assign({ Accept: 'application/json' }, options.body === undefined ? {} : { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf }), body: options.body === undefined ? undefined : JSON.stringify(options.body), signal: request.signal, keepalive: !!options.keepalive }).then(function (r) {
      if (r.status === 401 && currentUser && requestIdentity === csrf) showAuth();
      if (!r.ok) {
        return r.text().then(function (t) {
          var detail = '';
          try { var j = JSON.parse(t); detail = (j.error_code ? '[' + j.error_code + '] ' : '') + (j.detail || j.error || ''); } catch (e) {}
          if (!detail && r.status === 502) detail = '网关或反向代理未取得有效上游响应，请检查容器日志';
          throw new Error('HTTP ' + r.status + ' · ' + path.split('?')[0] + (detail ? ' · ' + detail : ''));
        });
      }
      return r.json();
    }).catch(function (e) {
      if (timedOut) throw new Error('请求超时，请检查网关状态后重试。');
      throw e;
    }).finally(function () { clearTimeout(timer); if (signal) signal.removeEventListener('abort', cancelled); });
  }

  function note(target, text) {
    target.innerHTML = '';
    var message = document.createElement('div');
    message.className = 'note';
    message.textContent = text;
    target.appendChild(message);
  }

  function card(item, index) {
    var box = document.createElement('div');
    box.className = 'card';

    var pic = document.createElement('div');
    pic.className = 'pic';
    if (item.cover) {
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.src = item.cover;
      img.alt = item.title || '';
      img.onerror = function () { img.remove(); };
      pic.appendChild(img);
    }
    if (item.rank) {
      var r = document.createElement('span');
      r.className = 'rank';
      r.textContent = '#' + item.rank;
      pic.appendChild(r);
    }

    var meta = document.createElement('div');
    meta.className = 'meta';
    var t = document.createElement('div');
    t.className = 'title';
    t.textContent = item.title || ('短剧 ' + (item.series_id || ''));
    var sub = document.createElement('div');
    sub.className = 'sub';
    var bits = [];
    if (item.episode_cnt) bits.push(item.episode_cnt + ' 集');
    if (item.score) bits.push('评分 ' + item.score);
    if (item.copyright) bits.push(item.copyright);
    if (item.status) bits.push(({want:'想看',watching:'在看',completed:'已看完'})[item.status] || '');
    if (item.vid) bits.push('看到第 ' + item.episode + ' 集 · ' + formatTime(item.position));
    sub.textContent = bits.join(' · ') || '\u00a0';
    meta.appendChild(t);
    meta.appendChild(sub);

    box.appendChild(pic);
    box.appendChild(meta);
    box.addEventListener('click', function () { openDetail(item); });
    if (view === 'history' || view === 'favorites') {
      var remove = document.createElement('button'); remove.type = 'button'; remove.textContent = view === 'history' ? '删除记录' : '取消追剧';
      remove.addEventListener('click', function (event) { event.stopPropagation(); var route = view === 'history' ? '/api/history/' : '/api/favorites/'; mutate(route + item.series_id, {}, 'DELETE').then(function () { showLibrary(view); }).catch(report); });
      meta.appendChild(remove);
    }
    return box;
  }

  function render(items, append) {
    if (!append) el.grid.innerHTML = '';
    items.forEach(function (it, i) { el.grid.appendChild(card(it, state.offset + i)); });
  }

  function setTabs() {
    el.tabs.innerHTML = '';
    TABS.forEach(function (tab) {
      var b = document.createElement('button');
      b.textContent = tab.name;
      b.setAttribute('aria-selected', String(!state.keyword && tab.id === state.tab.id));
      b.addEventListener('click', function () {
        if (state.tab.id === tab.id && !state.keyword) return;
        state.tab = tab;
        state.keyword = '';
        el.q.value = '';
        load(true);
      });
      el.tabs.appendChild(b);
    });
  }

  function load(reset) {
    if (!currentUser || view !== 'catalog') return;
    if (state.loading && !reset) return;
    if (listRequest) listRequest.abort();
    listRequest = new AbortController();
    var ticket = ++listSequence;
    state.loading = true;
    if (reset) { state.offset = 0; state.seen = []; el.more.hidden = true; }
    setTabs();
    el.grid.setAttribute('aria-busy', 'true');
    var offset = state.offset;

    var url;
    if (state.keyword) {
      url = '/gw/search?q=' + encodeURIComponent(state.keyword) +
        '&limit=' + PAGE + '&offset=' + state.offset;
    } else if (state.tab.kind === 'rank') {
      url = '/gw/rank?board=' + encodeURIComponent(state.tab.board) + '&limit=' + PAGE + '&offset=' + offset;
    } else {
      url = '/gw/browse?genre=' + encodeURIComponent(state.tab.genre) +
        '&limit=' + PAGE + '&offset=' + offset + '&seen=' + encodeURIComponent(state.seen.slice(-200).join(','));
    }

    api(url, listRequest.signal).then(function (data) {
      if (ticket !== listSequence) return;
      var items = data.items || data.results || [];
      if (reset && items.length === 0) {
        note(el.grid, '没有返回数据。可更换关键词或稍后重试；空列表无法单独判断故障原因。');
        el.more.hidden = true;
        return;
      }
      var fresh = items.filter(function (item) {
        var id = String(item.series_id || '');
        if (!id || state.seen.indexOf(id) >= 0) return false;
        state.seen.push(id);
        return true;
      });
      render(fresh, !reset);
      var next = Number(data.next_offset);
      state.offset = Number.isFinite(next) && next > offset ? next : offset + items.length;
      state.hasMore = data.has_more === true && state.offset > offset;
      el.more.hidden = !state.hasMore;
    }).catch(function (e) {
      if (ticket !== listSequence || e.name === 'AbortError') return;
      if (reset) note(el.grid, '加载失败：' + e.message);
      toast('请求失败：' + e.message);
    }).then(function () {
      if (ticket !== listSequence) return;
      state.loading = false;
      el.grid.removeAttribute('aria-busy');
    });
  }

  /** 打开详情：先拿分集，再按需起播 */
  function openDetail(item) {
    if (detailRequest) detailRequest.abort();
    detailRequest = new AbortController();
    var ticket = ++detailSequence;
    saveProgress(false);
    resetPlayer();
    currentSeries = item; currentEpisodes = []; savedLibrary = null; selectedEpisodes.clear();
    selectedEpisode = null; updatePlayerButtons();
    el.picks.innerHTML = ''; updatePickCount(); el.favorite.value = ''; el.favorite.disabled = false; el.resume.hidden = true;
    el.sheet.classList.add('open');
    el.title.textContent = item.title || '';
    el.desc.textContent = item.abstract || '（暂无简介）';
    el.meta.textContent = [
      item.episode_cnt ? item.episode_cnt + ' 集' : '',
      item.score ? '评分 ' + item.score : '',
      item.copyright || ''
    ].filter(Boolean).join(' · ');
    el.cover.removeAttribute('src');
    if (item.cover) { el.cover.src = item.cover; el.cover.referrerPolicy = 'no-referrer'; }
    el.eps.innerHTML = '<div class="note">正在读取分集…</div>';
    el.video.hidden = true;
    el.video.removeAttribute('src');

    Promise.all([api('/gw/episodes?series_id=' + encodeURIComponent(item.series_id), detailRequest.signal), api('/api/library/' + item.series_id, detailRequest.signal)])
      .then(function (responses) {
        if (ticket !== detailSequence) return;
        var data = responses[0]; savedLibrary = responses[1];
        el.favorite.value = savedLibrary.favorite;
        var recent = savedLibrary.recent; el.resume.hidden = !recent;
        if (recent) el.resume.textContent = '继续第 ' + recent.episode + ' 集 · ' + formatTime(recent.position);

        if (ticket !== detailSequence) return;
        var episodes = data.episodes || [];
        if (!episodes.length) {
          note(el.eps, '这部剧没有返回分集，请稍后重试。');
          return;
        }
        currentEpisodes = episodes;
        el.eps.innerHTML = '';
        episodes.forEach(function (ep, i) {
          var b = document.createElement('button');
          b.textContent = '第 ' + (ep.index || i + 1) + ' 集';
          b.addEventListener('click', function () {
            Array.prototype.forEach.call(el.eps.children, function (c) {
              c.setAttribute('aria-current', 'false');
            });
            b.setAttribute('aria-current', 'true');
            playEpisode(ep).catch(report);
          });
          el.eps.appendChild(b);
          var label = document.createElement('label'), checkbox = document.createElement('input');
          checkbox.type = 'checkbox'; checkbox.value = String(ep.index || i + 1);
          checkbox.addEventListener('change', function () { if (checkbox.checked) selectedEpisodes.add(Number(checkbox.value)); else selectedEpisodes.delete(Number(checkbox.value)); updatePickCount(); });
          label.appendChild(checkbox); var text = document.createElement('span'); text.textContent = '第 ' + (ep.index || i + 1) + ' 集'; label.appendChild(text); el.picks.appendChild(label);
          var progress = (savedLibrary.episodes || []).find(function (entry) { return entry.vid === String(ep.vid); });
          if (progress) b.title = progress.completed ? '已看完' : '续播 ' + formatTime(progress.position);

        });
      })
      .catch(function (e) {
        if (ticket !== detailSequence || e.name === 'AbortError') return;
        note(el.eps, '读取分集失败：' + e.message);
      });
  }

  function resetPlayer() {
    playback = null;
    clearTimeout(retryTimer); retryTimer = null;
    if (preloadRequest) preloadRequest.abort();
    preloadRequest = null; preloadBusy = false; preloadedVid = '';

    target.appendChild(node('p','已使用 ' + bytes(usage.bytes) + ' / ' + bytes(usage.maxBytes),'muted'));
    var tools = node('div',undefined,'toolbar');
    tools.appendChild(action('选择已完成',function(){jobs.filter(function(j){return j.state==='ready';}).slice(0,100).forEach(function(j){taskSelections.add(j.id);});refreshPanel();}));
    tools.appendChild(action('清空选择',function(){taskSelections.clear();refreshPanel();}));
    var selected = jobs.filter(function(j){return j.state==='ready' && taskSelections.has(j.id);});
    if (selected.length) { var zip = node('a','合并下载 ZIP（' + selected.length + ' 集）'); zip.href = '/api/downloads/archive?ids=' + encodeURIComponent(selected.map(function(j){return j.id;}).join(',')); zip.setAttribute('download','redguo-episodes.zip'); tools.appendChild(zip); }
    target.appendChild(tools);
    if (!jobs.length) target.appendChild(node('p','还没有下载任务。打开剧集，在批量下载中选择分集。','muted'));
    jobs.forEach(function(job){
      var row = node('div',undefined,'task'); row.appendChild(node('strong',job.series.title + ' · 第 ' + job.episode + ' 集'));
      row.appendChild(node('p',(usernames ? '用户：' + (usernames[job.user_id] || job.user_id) + ' · ' : '') + stateNames[job.state] + ' · ' + bytes(job.bytes) + (job.total ? ' / ' + bytes(job.total) : ''),'muted'));
      if(job.error) row.appendChild(node('p',job.error,'error'));
      if(job.state==='downloading'){var meter=node('progress');if(job.total){meter.value=job.bytes;meter.max=job.total;}row.appendChild(meter);}
      var operations=node('div',undefined,'toolbar');
      if(job.state==='ready'){
        var label=node('label','合并选择'),check=node('input');check.type='checkbox';check.checked=taskSelections.has(job.id);
        check.addEventListener('change',function(){if(check.checked)taskSelections.add(job.id);else taskSelections.delete(job.id);refreshPanel();});label.appendChild(check);operations.appendChild(label);
        var link=node('a','保存此集');link.href='/api/downloads/'+job.id+'/file';link.setAttribute('download','');operations.appendChild(link);
      }
      function command(name,label){operations.appendChild(action(label,async function(){if(name==='delete'&&!window.confirm('删除此任务及服务器文件？'))return;await mutate('/api/downloads/'+job.id,{command:name});taskSelections.delete(job.id);await refreshPanel();}));}
      if(['queued','downloading'].includes(job.state))command('cancel','取消');
      if(['failed','cancelled'].includes(job.state))command('retry','重试');
      command('delete','删除任务/文件');row.appendChild(operations);target.appendChild(row);
    });
  }
  async function refreshPanel() {
    var kind = panelKind, ticket = ++panelSequence;
    try {
      if (!kind || kind === 'account' || !currentUser) return;
      var data = await api(kind === 'admin' ? '/api/admin/downloads' : '/api/downloads');
      var summary, users;
      if(kind==='admin'){var extra=await Promise.all([api('/api/admin/summary'),api('/api/admin/users')]);summary=extra[0];users=extra[1].items;}
      if(ticket!==panelSequence || kind!==panelKind || !currentUser)return;
      var target=byId('panel-body');target.innerHTML='';
      if(kind==='admin')renderAdmin(target,summary,users);
      var names={};if(users)users.forEach(function(user){names[user.id]=user.username;});
      if(kind==='admin')target.appendChild(node('h3','全站下载任务'));
      renderTasks(target,data.items,data.usage,kind==='admin'?names:null);
    }catch(error){if(ticket===panelSequence)report(error);}
  }
  function renderAdmin(target,summary,users) {
    target.appendChild(action('刷新后台状态',refreshPanel));
    target.appendChild(node('p',summary.users+' 个用户 · '+summary.activeSessions+' 个有效会话 · 取流服务'+(summary.upstream.ready?'就绪':'未就绪')));
    if(summary.upstream.cache)target.appendChild(node('p','播放缓存：'+summary.upstream.cache.files+' 个文件 / '+summary.upstream.cache.mb+' MB','muted'));
    var form=node('form'),name=field(form,'新用户名'),pass=field(form,'初始密码','password'),role=node('select');
    ['user','admin'].forEach(function(value){var option=node('option',value==='admin'?'管理员':'普通用户');option.value=value;role.appendChild(option);});form.appendChild(role);
    var submit=node('button','创建用户');submit.type='submit';form.appendChild(submit);
    form.addEventListener('submit',async function(event){event.preventDefault();submit.disabled=true;try{await mutate('/api/admin/users',{username:name.value.trim(),password:pass.value,role:role.value});await refreshPanel();toast('用户已创建');}catch(error){report(error);}finally{submit.disabled=false;}});
    target.appendChild(node('h3','用户管理'));target.appendChild(form);
    users.forEach(function(user){
      var row=node('div',undefined,'task');row.appendChild(node('strong',user.username+(user.disabled?' · 已停用':'')));
      var tools=node('div',undefined,'toolbar'),roles=node('select');
      ['user','admin'].forEach(function(value){var option=node('option',value);option.value=value;roles.appendChild(option);});roles.value=user.role;tools.appendChild(roles);
      tools.appendChild(action('保存角色',async function(){await mutate('/api/admin/users/'+user.id,{role:roles.value},'PATCH');await refreshPanel();}));
      tools.appendChild(action(user.disabled?'启用账号':'停用账号',async function(){if(!window.confirm('确认'+(user.disabled?'启用':'停用')+' '+user.username+'？'))return;await mutate('/api/admin/users/'+user.id,{disabled:!user.disabled},'PATCH');await refreshPanel();}));
      var reset=node('input');reset.type='password';reset.placeholder='新密码（至少十位）';reset.autocomplete='new-password';reset.maxLength=128;tools.appendChild(reset);
      tools.appendChild(action('重置密码',async function(){await mutate('/api/admin/users/'+user.id,{password:reset.value},'PATCH');reset.value='';toast('密码已重置，原会话已失效');await refreshPanel();}));row.appendChild(tools);target.appendChild(row);
    });
    var logs=node('details');logs.appendChild(node('summary','最近管理操作'));
    summary.audit.forEach(function(entry){logs.appendChild(node('p',new Date(entry.created_at).toLocaleString()+' · '+(entry.username||entry.actor)+' · '+entry.action+' · '+entry.target,'muted'));});target.appendChild(logs);
  }
  setInterval(function(){if(panelKind==='downloads')refreshPanel();},3000);

  initAuth();
  poll();
  setInterval(poll, 15000);
})();
</script>
