# 短剧数据网关 —— 部署编排（只拉镜像，不构建）
#
#   docker compose pull
#   docker compose up -d
#
# 想用当前源码构建，叠加覆盖文件（不改本文件）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 常用变量（也可写进同目录 .env）：
#   GW_TAG=v1.1.1     固定镜像版本，默认 latest
#   GW_PORT=8080      宿主机端口

name: thlredguo

services:
  gateway:
    image: ghcr.io/kid941005/thlredguo-gateway:${GW_TAG:-latest}
    container_name: thlredguo-gateway
    # 让内置子进程被正确回收、SIGTERM 能转发
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

    ports:
      - "${GW_PORT:-8080}:8080"

    environment:
      PORT: "8080"
      HK_PORT: "8000"
      HK_QUALITY: "${HK_QUALITY:-best}"
      CACHE_TTL_MIN: "${CACHE_TTL_MIN:-180}"
      CACHE_MAX_MB: "${CACHE_MAX_MB:-2048}"
      TZ: "${TZ:-Asia/Shanghai}"

    # 卷内存放：解密缓存 + apikeys.json 备份（设备身份）。
    # 容器重建时镜像内的 apikeys.json 会丢，网关从这个卷里还原同一个 device_id；
    # 删掉卷 = 下次重建换新身份，更容易被上游风控。
    volumes:
      - gateway-data:/app/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gateway-data:
    name: thlredguo-gateway-data
