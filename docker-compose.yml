# 短剧数据网关 —— 部署编排（只拉镜像，不构建）
#
#   docker compose pull
#   docker compose up -d
#
# 想用当前源码构建，叠加覆盖文件（不改本文件）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 常用变量（也可写进同目录 .env）：
#   GW_TAG=v1.1.1     固定镜像版本，默认 latest
#   GW_PORT=8080      宿主机端口
#   GW_BIND=127.0.0.1 监听地址，默认只允许本机；局域网访问设 0.0.0.0（网关无鉴权）

# 项目名（顶层键，缩进必须为 0）。写成 services.gateway 下的 name 会报
# "additional properties 'name' not allowed" —— 服务里的容器名是 container_name。
name: thlredguo

services:
  gateway:
    image: ghcr.io/kid941005/thlredguo-gateway:${GW_TAG:-latest}
    container_name: thlredguo-gateway
    # 让内置子进程被正确回收、SIGTERM 能转发
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

    # 默认只监听回环：网关不带鉴权，任何能访问端口的人都能借你的设备身份取流。
    # 需要局域网 / 外网访问时显式放开：GW_BIND=0.0.0.0 docker compose up -d
    # 更稳妥的做法是保持回环，前面挂一层带鉴权的反向代理。
    ports:
      - "${GW_BIND:-127.0.0.1}:${GW_PORT:-8080}:8080"

    environment:
      PORT: "8080"
      HK_PORT: "8000"
      HK_QUALITY: "${HK_QUALITY:-best}"
      CACHE_TTL_MIN: "${CACHE_TTL_MIN:-180}"
      CACHE_MAX_MB: "${CACHE_MAX_MB:-2048}"
      TZ: "${TZ:-Asia/Shanghai}"

    # 卷内存放：解密缓存 + apikeys.json 备份（设备身份）。
    # 容器重建时镜像内的 apikeys.json 会丢，网关从这个卷里还原同一个 device_id；
    # 删掉卷 = 下次重建换新身份，更容易被上游风控。
    volumes:
      - gateway-data:/app/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gateway-data:
    name: thlredguo-gateway-data
